# agent-bridge gateway config. Copy to config.toml and edit.
# Any value can be overridden by an env var AGENT_BRIDGE_<SECTION>_<KEY> (upper-case),
# e.g. AGENT_BRIDGE_AUTH_TOKEN, AGENT_BRIDGE_SERVER_PORT.

[server]
host = "127.0.0.1"   # keep localhost; reach it via `ssh -L 8787:localhost:8787 midway5`
port = 8787

[auth]
# Shared bearer token. Leave empty to auto-generate one on first start
# (it is printed to the log and written to .token in the data dir).
token = ""

[worker]
concurrency = 2      # number of jobs run in parallel (mind sshd/cost limits)

[db]
path = "gateway.db"  # relative paths resolve against the data dir

[files]
# File upload/download surface (/v1/files, and files attached to jobs).
# dir = ""  -> per-user store under the system temp dir (tempfile.gettempdir(),
#              e.g. /tmp/agent-bridge-<uid>/files), created 0700 so other users
#              on the node can't read your uploads.
#              (Note: /tmp is reaped after ~10 days idle — fine for job inputs.)
# dir = "abs/path"       -> used as-is;  dir = "relname" -> under the data dir.
# The store is readable by forked agents and downloadable even though it's
# outside allowed_dirs; everything else stays sandboxed to allowed_dirs.
enabled = true
dir = ""
max_file_mb = 100          # per-file cap
max_request_mb = 512       # whole-request cap; larger data -> scp + pass {path}

[cluster]
# /v1/info advertises this machine's capabilities (host/CPU/RAM, local GPUs,
# Slurm partitions + GPU inventory, allocation balance). Probed once on startup
# (concurrently, in the background) and cached, so reads are instant.
enabled = true
probe_timeout_sec = 15
# env vars reported presence-only (yes/no) — values are NEVER exposed
env_presence = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]

[agents.claude]
bin = "claude"
# Dispatch mode:
#   "agent_exec"       -> the model finds the right session, forks it, and runs the
#                         task itself (via its own Bash tool). Matches the spec.
#   "select_then_exec" -> the model only returns a session id; the worker forks+execs
#                         it directly (cleaner streaming, more deterministic).
dispatch_mode = "agent_exec"
permission_mode = "bypassPermissions"
model = ""                 # empty = account default
default_cwd = "/project/jevans/tzhang3/agent-bridge"
allowed_dirs = [
    "/project/jevans/tzhang3",
    "/home/tzhang3",
]
timeout_sec = 0            # 0 (or negative) = no wall-clock limit; jobs run unbounded
max_sessions_in_index = 40 # how many recent sessions to show the dispatcher

# Models advertised at /v1/models (and by `ab models`) so a caller can choose by
# task complexity. This list IS the catalog — there is no built-in fallback, so
# an agent with no models here advertises none, and `model` on a job is then
# passed through unchecked. Add or reprice a model by editing here + restarting.
#   id     (required) what gets passed to the agent's --model
#   tier   the task complexity this model is the right default for. First model
#          of a tier wins when resolving tier -> id, so order matters.
#   rest   optional, shown to whoever is choosing. Unknown keys are ignored.
# Keep ids pinned rather than aliases: opus/sonnet/haiku track the newest model
# in each tier, so an alias makes a run non-reproducible once a new one ships.

[[agents.claude.models]]
id = "claude-haiku-4-5"
alias = "haiku"
tier = "simple"
context = "200K"
input_per_mtok = 1.0
output_per_mtok = 5.0
use = "Classification, extraction, formatting, short lookups. Fastest and cheapest; the only model here under 1M context."

[[agents.claude.models]]
id = "claude-sonnet-5"
alias = "sonnet"
tier = "standard"
context = "1M"
input_per_mtok = 2.0
output_per_mtok = 10.0
use = "Most coding, analysis, and multi-step work. Near-Opus quality on agentic tasks at a third of the cost — the default choice."
note = "introductory pricing through 2026-08-31; list is 3.00/15.00"

[[agents.claude.models]]
id = "claude-opus-5"
alias = "opus"
tier = "hard"
context = "1M"
input_per_mtok = 5.0
output_per_mtok = 25.0
use = "Complex agentic coding, long-horizon autonomous runs, deep reasoning. Worth it when the task spans many files or hours."

[[agents.claude.models]]
id = "claude-fable-5"
tier = "frontier"
context = "1M"
input_per_mtok = 10.0
output_per_mtok = 50.0
use = "The hardest reasoning and longest-horizon work. Turns can run many minutes. Reach for it only when Opus 5 has fallen short."
