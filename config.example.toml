# agent-bridge gateway config. Copy to config.toml and edit.
# Any value can be overridden by an env var AGENT_BRIDGE_<SECTION>_<KEY> (upper-case),
# e.g. AGENT_BRIDGE_AUTH_TOKEN, AGENT_BRIDGE_SERVER_PORT.

[server]
host = "127.0.0.1"   # keep localhost; reach it via `ssh -L 8787:localhost:8787 midway5`
port = 8787

[auth]
# Shared bearer token. Leave empty to auto-generate one into `.token` in the
# data dir (mode 0600). Startup does not print it; use --print-token explicitly.
token = ""

[worker]
# Queued rows are re-enqueued after a gateway restart. A row that was running
# is failed with an explicit gateway-restarted event; process recovery is not
# guessed. Graceful shutdown interrupts and joins before SQLite closes.
concurrency = 2      # number of jobs run in parallel (mind sshd/cost limits)

# Cancel interrupts rather than kills: SIGINT (what ESC maps to in the
# interactive client) lets the agent stop its turn, flush the transcript and
# exit, so the session stays resumable. Escalates to SIGTERM then SIGKILL only
# if it hasn't wound down in this long.
cancel_grace_sec = 15
# Only for jobs submitted with expect_report (opt-in): such a job parks in
# `awaiting_report` when its turn ends, and only a terminal report closes it --
# `echo finished > "$AB_JOB_DIR/status"`, or an HTTP report. This is how long to
# wait before giving up. 0 = wait forever. Ordinary jobs finish with their turn
# and never park, so this does not apply to them.
report_timeout_sec = 86400

# What this machine's owner knows and no probe can discover: scheduler
# accounts, full filesystems, which env holds which package. Served beside the
# probed facts on /v1/info. Edited on the host — by an agent job, by `ab
# upload`, or in an editor over ssh — so there is no write endpoint.
[notes]
path = "gateway.md"    # relative paths resolve against the data dir
max_bytes = 65536      # how much of it is served

[db]
path = "gateway.db"  # relative paths resolve against the data dir

[messages]
# Where `ab-notify` drops a message when it cannot reach the gateway over HTTP.
# Must be on a filesystem the COMPUTE NODES share with the login node (GPFS
# /project, not /tmp). Relative paths resolve against the data dir.
#
# Batch jobs never write gateway.db directly: it runs in WAL mode, whose index
# is mmap'd shared memory and so requires every writer on one host. Appending
# JSONL with O_APPEND needs no locking; the gateway ingests it on read and uses
# the same monotonic event cursor. Give retries a stable --report-id.
dir = "messages"

[files]
# File upload/download surface (/v1/files, and files attached to jobs).
# dir = ""  -> per-user store under the system temp dir (tempfile.gettempdir(),
#              e.g. /tmp/agent-bridge-<uid>/files), created 0700 so other users
#              on the node can't read your uploads.
#              (Note: /tmp is reaped after ~10 days idle — fine for job inputs.)
# dir = "abs/path"       -> used as-is;  dir = "relname" -> under the data dir.
# The store is readable by forked agents and downloadable even though it's
# outside allowed_dirs; everything else stays sandboxed to allowed_dirs.
enabled = true
dir = ""
max_file_mb = 100          # per-file cap
max_request_mb = 512       # whole-request cap; larger data -> scp + pass {path}

[cluster]
# /v1/info advertises this machine's capabilities (host/CPU/RAM, local GPUs,
# Slurm partitions + GPU inventory, allocation balance). Probed once on startup
# (concurrently, in the background) and cached, so reads are instant.
enabled = true
probe_timeout_sec = 15
# env vars reported presence-only (yes/no) — values are NEVER exposed
env_presence = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "DEEPSEEK_API_KEY"]

[agents.claude]
bin = "claude"
# Dispatch mode:
#   "direct"           -> DEFAULT. Run in the session the caller named (--session),
#                         or a fresh one if none. No routing model in the path.
#   "agent_exec"       -> a dispatcher session finds a session, forks it, and runs
#                         the task via its own Bash tool.
#   "select_then_exec" -> the model only returns a session id; the worker forks and
#                         execs it directly.
#
# The two dispatcher modes put a whole Claude session in front of every job just
# to choose a fork target. That is nondeterministic, costs a session per job, and
# silently ignores --model (a fork inherits its parent's). Because forks also
# inherit conversational context, dispatched sessions learned to reply "I'll
# report back" instead of working. Prefer "direct" and name the session.
dispatch_mode = "direct"
permission_mode = "bypassPermissions"
model = ""                 # empty = account default
default_cwd = "/project/jevans/tzhang3/agent-bridge"
allowed_dirs = [
    "/project/jevans/tzhang3",
    "/home/tzhang3",
]
timeout_sec = 0            # 0 (or negative) = no wall-clock limit; jobs run unbounded
max_sessions_in_index = 40 # how many recent sessions to show the dispatcher

# Models advertised by /v1/agents, /v1/models, `ab agents`, and `ab models`.
# These are backend ids passed through verbatim, not aliases or pricing tiers.
# Edits take effect on restart.
models = [
    "claude-haiku-4-5",
    "claude-sonnet-5",
    "claude-opus-5",
    "claude-fable-5",
]

[agents.opencode]
bin = "opencode"
# The opencode adapter supports dispatch_mode="direct" only — the dispatcher
# modes rely on Claude-only flags (--tools, --json-schema, structured output).
dispatch_mode = "direct"
# Non-interactive runs need tools pre-approved or opencode denies them all;
# "auto" is the opencode spelling of claude's bypassPermissions.
permission_mode = "auto"
# Deterministic default for `--agent opencode` with no --model; override per
# job with --model. Model ids are provider/model (see `opencode models`).
model = "deepseek/deepseek-v4-flash"
default_cwd = "/project/jevans/tzhang3/agent-bridge"
allowed_dirs = [
    "/project/jevans/tzhang3",
    "/home/tzhang3",
]
timeout_sec = 0            # 0 (or negative) = no wall-clock limit; jobs run unbounded
max_sessions_in_index = 40 # how many recent sessions to show in /v1/sessions

# opencode/deepseek auth lives in opencode's own store (~/.local/share/opencode),
# not an env var, so nothing extra is needed here. Models opencode advertises;
# deepseek-chat and deepseek-reasoner are sunset. See `opencode models deepseek`
# on the gateway host for the authoritative list.
models = [
    "deepseek/deepseek-v4-flash",
    "deepseek/deepseek-v4-pro",
]
