[project]
name = "agent-bridge"
dynamic = ["version"]
description = "HTTP gateway and stdlib clients for dispatching prompts to coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
ab = "client.ab:main"
agent-bridge = "gateway.__main__:main"
ab-notify = "worker.notify:main"
ab-monitor = "worker.monitor:main"
ab-serve = "gateway.serve:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["agent_bridge_version"]

[tool.setuptools.packages.find]
include = ["gateway*", "client*", "worker*"]

[tool.setuptools.dynamic]
version = {attr = "client._version.__version__"}

# The gateway needs the dependencies above. `client/` (the caller's side) and
# `worker/` (the delegate's own tools) remain stdlib only at runtime and can
# still be copied or invoked directly without installing.
